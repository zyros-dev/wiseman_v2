name: CI

on:
  pull_request:
  push:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install TLS trust store
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates default-jre-headless
      - name: Install uv
        run: |
          set -eu
          node --input-type=module -e '
            const response = await fetch("https://github.com/astral-sh/uv/releases/download/0.8.17/uv-x86_64-unknown-linux-gnu.tar.gz");
            if (!response.ok) throw new Error(`uv download failed: ${response.status}`);
            process.stdout.write(Buffer.from(await response.arrayBuffer()));
          ' > /tmp/uv.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/uv.tar.gz -C /tmp
          install /tmp/uv-x86_64-unknown-linux-gnu/uv "$HOME/.local/bin/uv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: GraphWalker model
        run: |
          set -eu
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const url = "https://github.com/GraphWalker/graphwalker-project/releases/download/4.3.3/graphwalker-cli-4.3.3.jar";
            const response = await fetch(url);
            if (!response.ok) throw new Error(`GraphWalker download failed: ${response.status}`);
            writeFileSync("/tmp/graphwalker-cli-4.3.3.jar", Buffer.from(await response.arrayBuffer()));
          '
          echo '8300b4ad7faf2ad2c0acde9ec0a6ffbbafe59ce51d05b5e00e971272c9364317  /tmp/graphwalker-cli-4.3.3.jar' | sha256sum -c -
          uv run python -c 'import json; from pathlib import Path; from tests.graphwalker.model import model; Path("/tmp/wiseman.json").write_text(json.dumps(model()))'
          java -jar /tmp/graphwalker-cli-4.3.3.jar offline -g /tmp/wiseman.json -d 42 > /tmp/wiseman-path-coverage.jsonl
          test -s /tmp/wiseman-path-coverage.jsonl
          GRAPHWALKER_PATH=/tmp/wiseman-path-coverage.jsonl GRAPHWALKER_COVERAGE=1 uv run pytest -q tests/test_graph_http.py
          uv run python tools/run_graph_walks.py \
            --jar /tmp/graphwalker-cli-4.3.3.jar \
            --model /tmp/wiseman.json \
            --artifacts /tmp/wiseman-graph-walks \
            --start-seed 2026 \
            --count 16 \
            --parallelism 16 \
            --steps 100
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Source budget
        run: uv run python tools/check_source_budget.py
      - name: Pyrefly
        run: uv run pyrefly check src sandbox/src tests tools
      - name: Pyright
        run: uv run pyright
      - name: Tests and coverage
        run: uv run pytest --cov --cov-report=term-missing
      - name: Dead code
        run: uv run vulture src sandbox/src tests tools --min-confidence 100
      - name: Dependency audit
        run: uv run pip-audit
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates docker.io
      - name: Compile and sandbox smoke
        run: |
          docker build -t wiseman-v2-gateway:ci .
          docker build -t wiseman-v2-sandbox:ci -f sandbox/Dockerfile .
          docker run --rm wiseman-v2-gateway:ci python -m compileall -q src
          docker run --rm wiseman-v2-sandbox:ci python -m compileall -q sandbox/src
          container=$(docker run -d wiseman-v2-sandbox:ci)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            docker exec "$container" curl --fail --silent http://127.0.0.1:8090/healthz && exit 0
            sleep 1
          done
          docker logs "$container"
          exit 1
