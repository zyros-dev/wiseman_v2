name: CI

on:
  pull_request:
  push:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        run: |
          set -eu
          node --input-type=module -e '
            const response = await fetch("https://github.com/astral-sh/uv/releases/download/0.8.17/uv-x86_64-unknown-linux-gnu.tar.gz");
            if (!response.ok) throw new Error(`uv download failed: ${response.status}`);
            process.stdout.write(Buffer.from(await response.arrayBuffer()));
          ' > /tmp/uv.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/uv.tar.gz -C /tmp
          install /tmp/uv-x86_64-unknown-linux-gnu/uv "$HOME/.local/bin/uv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pyrefly
        run: uv run pyrefly check
      - name: Tests and coverage
        run: uv run pytest --cov --cov-report=term-missing
      - name: Dead code
        run: uv run vulture src sandbox/src tests --min-confidence 100
      - name: Dependency audit
        run: uv run pip-audit
