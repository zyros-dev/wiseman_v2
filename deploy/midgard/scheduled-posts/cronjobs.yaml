# Wiseman V2 scheduled posts (ported from v1 Hermes cron, 2026-10-08).
# Published by .gitea/workflows/release.yml together with the generated
# wiseman-v2-scheduled-posts ConfigMap holding scheduled_post.py.
---
# LeetCode daily problem thread
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wiseman-v2-post-leetcode
  namespace: midgard-apps
  labels:
    app: wiseman-v2-scheduled-posts
spec:
  schedule: "0 0 * * *"
  timeZone: Australia/Sydney
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: wiseman-v2-scheduled-posts
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: post
              image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
              command: ["python3", "/app/scheduled_post.py", "leetcode"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: DISCORD_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: wiseman-v2-gateway
                      key: DISCORD_BOT_TOKEN
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: wiseman-v2-scheduled-posts
