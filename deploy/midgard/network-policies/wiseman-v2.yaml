apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wiseman-v2-sandbox
  namespace: midgard-apps
spec:
  podSelector:
    matchLabels:
      app: wiseman-v2-sandbox
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wiseman-v2-gateway
      ports:
        - protocol: TCP
          port: 8090
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: midgard-monitor
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8090
  egress:
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    - to:
        - podSelector:
            matchLabels:
              app: wiseman-v2-gateway
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wiseman-v2-gateway
  namespace: midgard-apps
spec:
  podSelector:
    matchLabels:
      app: wiseman-v2-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: midgard-monitor
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app: wiseman-v2-sandbox
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app: heimdall
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: midgard-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - protocol: TCP
          port: 7233
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: midgard-apps
          podSelector:
            matchLabels:
              app: wiseman-v2-sandbox
      ports:
        - protocol: TCP
          port: 8090
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: midgard-monitor
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-gateway
      ports:
        - protocol: TCP
          port: 4318
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: midgard-apps
          podSelector:
            matchLabels:
              app: phoenix
      ports:
        - protocol: TCP
          port: 6006
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: midgard-apps
          podSelector:
            matchLabels:
              app: heimdall
      ports:
        - protocol: TCP
          port: 9300
