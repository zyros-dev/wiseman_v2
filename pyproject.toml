[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wiseman-v2"
version = "0.1.0"
description = "Discord Codex runtime with Temporal workflows and Phoenix observability"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.5,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "opentelemetry-api>=1.31,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.31,<2",
  "opentelemetry-sdk>=1.31,<2",
  "openai-codex==0.147.0",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "temporalio>=1.10,<2",
  "uvicorn[standard]>=0.34,<1",
  "jsonschema>=4.23,<5",
  "arize-phoenix-client>=1,<2",
  "httpx-sse>=0.4,<1",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.6,<8",
  "hypothesis>=6.140,<7",
  "pip-audit>=2.7,<3",
  "pyrefly==1.2.0",
  "pyright>=1.1,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "vulture>=2.14,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src", "sandbox/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 160
src = ["src", "sandbox/src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # conflicts with formatter
  "D",       # docstrings are added to public integration boundaries
  "EM101",   # exception strings remain readable at small boundaries
  "FIX002",  # TODOs are tracked in implementation issues
  "ISC001",  # conflicts with formatter
  "S101",    # assertions are appropriate in tests
  "TD003",   # TODO issue links are not required in local code
  "TRY003",  # boundary errors carry concise operational details
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
max-branches = 10
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"sandbox/src/runner/api.py" = ["S603"]
"sandbox/src/runner/jobs.py" = ["BLE001"]
"src/app/temporal_runtime.py" = ["BLE001", "PLC0415"]
"src/app/http_api.py" = ["TC001"]
"tests/**/*.py" = [
  "ANN", "ARG", "ASYNC110", "B010", "B018", "N802", "PLC2701", "PLR2004", "S106", "SIM905", "SLF001"
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 55
show_missing = true

[tool.vulture]
min_confidence = 100

[tool.uv]
package = true
