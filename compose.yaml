services:
  wiseman:
    build: .
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?set DISCORD_BOT_TOKEN}
      WISEMAN_DISCORD_ALLOWLIST: ${WISEMAN_DISCORD_ALLOWLIST:?set WISEMAN_DISCORD_ALLOWLIST}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:?set TEMPORAL_ADDRESS}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-wiseman}
      PHOENIX_OTLP_ENDPOINT: ${PHOENIX_OTLP_ENDPOINT:?set PHOENIX_OTLP_ENDPOINT}
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:?set PHOENIX_API_KEY}
      PHOENIX_PROJECT: ${PHOENIX_PROJECT:-wiseman-v2}
      PHOENIX_PROMPT_HUB_URL: ${PHOENIX_PROMPT_HUB_URL:?set PHOENIX_PROMPT_HUB_URL}
      WISEMAN_RUNNER_URL: http://sandbox:8090
      WISEMAN_RELAY_URL: http://wiseman:8080/v1
      WISEMAN_RUNNER_API_TOKEN: ${WISEMAN_RUNNER_API_TOKEN:?set WISEMAN_RUNNER_API_TOKEN}
      WISEMAN_MCP_TOKEN: ${WISEMAN_RUNNER_API_TOKEN:?set WISEMAN_RUNNER_API_TOKEN}
      WISEMAN_PROVIDER_TOKEN: ${WISEMAN_RUNNER_API_TOKEN:?set WISEMAN_RUNNER_API_TOKEN}
      OPENROUTER_URL: ${OPENROUTER_URL:-https://openrouter.ai}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
      WISEMAN_REPLAY_TOKEN: ${WISEMAN_REPLAY_TOKEN:?set WISEMAN_REPLAY_TOKEN}
      WISEMAN_ALLOW_PROFILE_EDITS: ${WISEMAN_ALLOW_PROFILE_EDITS:-0}
      WISEMAN_ACTIVITY_FILE: /var/lib/wiseman/thread_activity.json
    volumes:
      - wiseman-state:/var/lib/wiseman
    ports:
      - "8080:8080"
    depends_on:
      - sandbox
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    environment:
      WISEMAN_RUNNER_API_TOKEN: ${WISEMAN_RUNNER_API_TOKEN:?set WISEMAN_RUNNER_API_TOKEN}
      WISEMAN_MCP_TOKEN: ${WISEMAN_RUNNER_API_TOKEN:?set WISEMAN_RUNNER_API_TOKEN}
      WISEMAN_PROVIDER_TOKEN: ${WISEMAN_RUNNER_API_TOKEN:?set WISEMAN_RUNNER_API_TOKEN}
      WISEMAN_WORKSPACE_ROOT: /workspaces
      WISEMAN_MANAGE_ACCOUNTS: "1"
      WISEMAN_RELAY_URL: http://wiseman:8080/v1
      WISEMAN_MCP_URL: http://wiseman:8080/v1/mcp
      WISEMAN_CODEX_BIN: ${WISEMAN_CODEX_BIN:-/usr/local/bin/codex-as-user}
    volumes:
      - wiseman-workspaces:/workspaces
    read_only: false

volumes:
  wiseman-state:
  wiseman-workspaces:
